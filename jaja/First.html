<html>
  <head>
    <title>Boites de type bloc en flux normal</title>
	<style type="text/css">
	.rouge {background-color: #ff9999;}
	.vert {background-color: #99cc99;}
	.bleu {background-color: #9999cc;
	width: 50%; height:50px; margin-top: 50px; /* propriétés applicable pour un élément bloc */
	}
	</style>
  </head>
  <body>
    <p class="rouge">Une boite rouge</p>
	<p class="vert">Une boite verte</p>
	<p class="bleu">Une boite bleu</p>
  </body>
  </html>
